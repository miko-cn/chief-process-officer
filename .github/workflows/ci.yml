name: CI

# 触发策略（2026-08-15 调整）：
# - 普通 push / PR 不触发——日常迭代（含 agent 工作日开发）不跑 CI
# - 打 tag（v*，如 v0.1.0）触发：发布/里程碑节点验证
# - 也可在 GitHub Actions 页面手动 "Run workflow" 按需验证
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # SPEC §6：CI 矩阵覆盖 Win10 与 Win11（Windows App SDK 支持 1809+）
        os: [windows-2022, windows-latest]  # windows-2022 ≈ Win10 21H2 内核；windows-latest ≈ Win11
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Cpo.sln -p:Platform=x64

      - name: Build (x64)
        run: dotnet build Cpo.sln -c Release -p:Platform=x64 --no-restore

      # 铁律（SPEC §12）：编译 + 单测强制；遥测回放测试是核心质量门禁。
      # 本 workflow 在打 tag / 手动触发时运行（见文件顶部触发策略）。
      - name: Unit tests
        run: dotnet test tests/Cpo.Tests/Cpo.Tests.csproj -c Release -p:Platform=x64 --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/Cpo.Tests/TestResults/*.trx
